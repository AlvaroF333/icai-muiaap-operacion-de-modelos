[project]
name = "solucion-semana7-aemet"
version = "0.1.0"
description = "Semana 7 - Práctica Requests + AEMET: climatología diaria de Madrid Ciudad Universitaria (octubre 2019)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.2",
]

[project.scripts]
aemet-octubre = "solucion_semana7_aemet.__main__:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
